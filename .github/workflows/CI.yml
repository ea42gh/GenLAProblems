name: CI
on:
  push:
    branches:
      - main
    tags: ['*']
  pull_request:
  workflow_dispatch:
concurrency:
  # Skip intermediate builds: always.
  # Cancel intermediate builds: only if it is a pull request build.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}
jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions: # needed to allow julia-actions/cache to proactively delete old caches that it has created
      actions: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1.10'
          - '1.11'
          - '1.12'
          - 'pre'
        os:
          - ubuntu-latest
        arch:
          - x64
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    permissions:
      actions: write # needed to allow julia-actions/cache to proactively delete old caches that it has created
      contents: write
      statuses: write
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.10'
      - uses: julia-actions/cache@v3
      - name: Develop local docs dependency
        shell: julia --project=docs --color=yes {0}
        run: |
          using Pkg
          Pkg.develop(path=pwd())
          Pkg.instantiate()
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-docdeploy@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
      - name: Run doctests
        shell: julia --project=docs --color=yes {0}
        run: |
          using Documenter: DocMeta, doctest
          using GenLAProblems
          DocMeta.setdocmeta!(GenLAProblems, :DocTestSetup, :(using GenLAProblems); recursive=true)
          doctest(GenLAProblems)

  renderer-smoke:
    name: Renderer/Binder smoke - Julia 1.10 - Python 3.11
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      JULIA_CONDAPKG_BACKEND: Null
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: ea42gh/LAlatex
          path: LAlatex
      - uses: actions/setup-python@v6
        id: setup-python
        with:
          python-version: "3.11"
      - name: Install Python renderer stack
        run: |
          "${{ steps.setup-python.outputs.python-path }}" -m pip install --upgrade pip
          "${{ steps.setup-python.outputs.python-path }}" -m pip install \
            "matrixlayout[render] @ git+https://github.com/ea42gh/matrixlayout.git@e3c0153aede5013827f55fd9cff7e4ec34520612" \
            "LAFigureSpecs @ git+https://github.com/ea42gh/LAFigureSpecs.git@49d4329512ba6d51b1d2ec774abb00899f04a095"
          "${{ steps.setup-python.outputs.python-path }}" -c "import matrixlayout, LAFigureSpecs; print(matrixlayout.__name__, LAFigureSpecs.__name__)"
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.10'
          arch: x64
      - uses: julia-actions/cache@v3
      - name: Develop sibling LAlatex
        shell: julia --project=. {0}
        env:
          JULIA_PYTHONCALL_EXE: ${{ steps.setup-python.outputs.python-path }}
        run: |
          using Pkg
          Pkg.develop(path=joinpath(pwd(), "LAlatex"))
          Pkg.instantiate()
      - name: Run GenLAProblems display smoke
        env:
          JULIA_PYTHONCALL_EXE: ${{ steps.setup-python.outputs.python-path }}
          JULIA_PROJECT: ${{ github.workspace }}
          PYTHON_JULIACALL_EXE: julia
          PYTHON_JULIACALL_PROJECT: ${{ github.workspace }}
        run: |
          "${{ steps.setup-python.outputs.python-path }}" render_smoke.py


