name: CI
on:
  push:
    branches:
      - main
    tags: ['*']
  pull_request:
  workflow_dispatch:
concurrency:
  # Skip intermediate builds: always.
  # Cancel intermediate builds: only if it is a pull request build.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}
jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions: # needed to allow julia-actions/cache to proactively delete old caches that it has created
      actions: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1.10'
          - '1.11'
          - '1.12'
          - 'pre'
        os:
          - ubuntu-latest
        arch:
          - x64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v3
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - uses: julia-actions/cache@a45e8fa8be21c18a06b7177052533149e61e9b38 # v3
      - uses: julia-actions/julia-buildpkg@e3eb439fad4f9aba7da2667e7510e4a46ebc46e1 # v1
      - uses: julia-actions/julia-runtest@6e050c8013b833b1195105ff2fce9cd802f53271 # v1
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    permissions:
      actions: write # needed to allow julia-actions/cache to proactively delete old caches that it has created
      contents: write
      statuses: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v3
        with:
          version: '1.10'
      - uses: julia-actions/cache@a45e8fa8be21c18a06b7177052533149e61e9b38 # v3
      - name: Develop local docs dependency
        shell: julia --project=docs --color=yes {0}
        run: |
          using Pkg
          Pkg.develop(path=pwd())
          Pkg.instantiate()
      - uses: julia-actions/julia-buildpkg@e3eb439fad4f9aba7da2667e7510e4a46ebc46e1 # v1
      - uses: julia-actions/julia-docdeploy@e62cc8fd639797a0c2922a437d5b1b81c4a12787 # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
      - name: Run doctests
        shell: julia --project=docs --color=yes {0}
        run: |
          using Documenter: DocMeta, doctest
          using GenLAProblems
          DocMeta.setdocmeta!(GenLAProblems, :DocTestSetup, :(using GenLAProblems); recursive=true)
          doctest(GenLAProblems)

  renderer-smoke:
    name: Renderer/Binder smoke - Julia 1.10 - Python 3.12
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      JULIA_CONDAPKG_BACKEND: Null
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ea42gh/LAlatex
          path: LAlatex
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        id: setup-python
        with:
          python-version: "3.12"
      - name: Install Python renderer stack
        run: |
          "${{ steps.setup-python.outputs.python-path }}" -m pip install --upgrade pip
          "${{ steps.setup-python.outputs.python-path }}" -m pip install \
            "matrixlayout[render] @ git+https://github.com/ea42gh/matrixlayout.git" \
            "LAFigureSpecs @ git+https://github.com/ea42gh/LAFigureSpecs.git"
          "${{ steps.setup-python.outputs.python-path }}" -c "import matrixlayout, LAFigureSpecs; print(matrixlayout.__name__, LAFigureSpecs.__name__)"
      - uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v3
        with:
          version: '1.10'
          arch: x64
      - uses: julia-actions/cache@a45e8fa8be21c18a06b7177052533149e61e9b38 # v3
      - name: Develop sibling LAlatex
        shell: julia --project=. {0}
        env:
          JULIA_PYTHONCALL_EXE: ${{ steps.setup-python.outputs.python-path }}
        run: |
          using Pkg
          Pkg.develop(path=joinpath(pwd(), "LAlatex"))
          Pkg.instantiate()
      - name: Run GenLAProblems display smoke
        env:
          JULIA_PYTHONCALL_EXE: ${{ steps.setup-python.outputs.python-path }}
          JULIA_PROJECT: ${{ github.workspace }}
          PYTHON_JULIACALL_EXE: julia
          PYTHON_JULIACALL_PROJECT: ${{ github.workspace }}
        run: |
          "${{ steps.setup-python.outputs.python-path }}" render_smoke.py


